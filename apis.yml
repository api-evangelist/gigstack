aid: gigstack
name: Gigstack
description: >-
  Gigstack (gigstack.pro) is a Mexican fintech and revenue-automation platform
  that automates electronic invoicing and tax compliance for businesses
  operating in Mexico. It generates CFDI 4.0 fiscal invoices through the SAT/PAC
  stamping pipeline, runs collections (cobranza) and accounts-receivable
  workflows, offers self-invoicing (autofactura) and customer portals, and
  performs automated SAT reconciliation and bulk SAT downloads (descarga
  masiva). Its REST API (v2, https://api.gigstack.io/v2) exposes clients,
  services, invoices (income/egress/draft/payment-complement), payments,
  receipts, retentions, teams, users, webhooks and SAT catalogs, with an
  official CLI and MCP server for terminal and agent workflows. Backed by
  500 Global.
